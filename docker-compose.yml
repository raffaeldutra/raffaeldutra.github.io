# Stack local do site (Hugo). Suba com `make up` ou `docker compose up server`.
#
#   server  -> Hugo em modo servidor com live-reload (http://localhost:1313)
#   build   -> gera o site estático em ./public (perfil "build")
#   nginx   -> serve ./public como em produção (http://localhost:8080, perfil "preview")

x-hugo-image: &hugo-image ${HUGO_IMAGE:-hugomods/hugo:latest}
x-bootstrap: &bootstrap >-
  hugo mod get github.com/zetxek/adritian-free-hugo-theme &&
  hugo mod npm pack &&
  npm install

services:
  server:
    image: *hugo-image
    container_name: rd-hugo-server
    working_dir: /src
    command: ["sh", "-c", "hugo mod get github.com/zetxek/adritian-free-hugo-theme && hugo mod npm pack && npm install && hugo server --bind 0.0.0.0 --baseURL ${BASEURL:-http://localhost:1313}"]
    volumes:
      - .:/src
    ports:
      - "${SERVER_PORT:-1313}:1313"

  build:
    image: *hugo-image
    container_name: rd-hugo-build
    working_dir: /src
    profiles: ["build"]
    command: ["sh", "-c", "hugo mod get github.com/zetxek/adritian-free-hugo-theme && hugo mod npm pack && npm install && hugo --gc --minify"]
    volumes:
      - .:/src

  nginx:
    image: nginx:alpine
    container_name: rd-hugo-nginx
    profiles: ["preview"]
    volumes:
      - ./hugo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    ports:
      - "${PREVIEW_PORT:-8080}:80"
