name: Build and Deploy page
on:
  push:
    branches:
      - develop
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false

      - name: Testing Configuration
        run: |
          cat config.toml | grep baseurl 2>/dev/null >/dev/null || exit 1

      - name: Install and Build
        run: |
          mkdir -p public/resume
          docker run --rm -v $(pwd):/src -v $(pwd)/public:/src/public raffaeldutra/docker-gohugo:v1.1
          # Docverter (c.docverter.com) is defunct; keep the deploy green while a
          # replacement PDF renderer is chosen. Resume PDF links are broken meanwhile.
          curl \
          --form input_files[]=@content/cv/me.en.md \
          --form from=markdown \
          --form to=pdf \
          --form other_files[]=@content/cv/css/resume.css \
          http://c.docverter.com/convert > public/resume/rafael-dutra-resume-en.pdf || true
          curl \
          --form input_files[]=@content/cv/me.md \
          --form from=markdown \
          --form to=pdf \
          --form other_files[]=@content/cv/css/resume.css \
          http://c.docverter.com/convert > public/resume/rafael-dutra-resume.pdf || true
          # Drop any 0-byte files left behind by a failed curl so we serve 404s, not empty PDFs
          find public/resume -type f -empty -delete

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@releases/v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: master
          FOLDER: public

      - name: Testing Deployment
        run: |
          docker run --rm byrnedo/alpine-curl curl --silent rafaeldutra.me > /dev/null || exit 1
