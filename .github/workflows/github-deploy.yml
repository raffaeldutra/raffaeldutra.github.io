name: Build and Deploy page

on:
  push:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.165.0"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false

      - name: Testing configuration
        run: grep -q '^baseURL' hugo.toml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Install theme module + npm dependencies
        run: |
          hugo mod get github.com/zetxek/adritian-free-hugo-theme
          hugo mod npm pack
          npm ci || npm install

      - name: Build
        env:
          HUGO_ENV: production
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: master
          folder: public
          clean: true

      - name: Testing deployment
        run: curl --silent --show-error --fail https://rafaeldutra.me > /dev/null
