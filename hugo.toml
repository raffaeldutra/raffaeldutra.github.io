baseURL = "https://rafaeldutra.me/"
title = "Rafael Dutra"
locale = "pt-BR"

defaultContentLanguage = "pt-br"
defaultContentLanguageInSubdir = false

# Necessário para o layouts/robots.txt do tema ser renderizado.
enableRobotsTXT = true

[pagination]
pagerSize = 6

[permalinks]
post = "/:year/:month/:day/:slug"
blog = "/blog/:year/:month/:day/:slug"

[sitemap]
changefreq = "monthly"
filename = "sitemap.xml"
priority = 0.5

[outputs]
page = ["HTML"]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term = ["HTML", "RSS"]

[taxonomies]
tag = "tags"
category = "categories"
author = "authors"
series = "series"
topic = "topics"

[module]
[[module.imports]]
path = "github.com/zetxek/adritian-free-hugo-theme"

## Mounts base — expõe os diretórios do site ao Hugo
[[module.mounts]]
source = "archetypes"
target = "archetypes"
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "i18n"
target = "i18n"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "content"
target = "content"
[[module.mounts]]
source = "data"
target = "data"

## Mounts do Bootstrap / busca — precisam de `npm install` na raiz
[[module.mounts]]
source = "node_modules/bootstrap/scss"
target = "assets/scss/bootstrap"
[[module.mounts]]
source = "node_modules/bootstrap/dist/js"
target = "assets/js/bootstrap"
[[module.mounts]]
source = "node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
target = "assets/js/vendor/bootstrap.bundle.min.js"
[[module.mounts]]
source = "node_modules/bootstrap-print-css/css/bootstrap-print.css"
target = "assets/css/bootstrap-print.css"

## Busca (fuse.js) e sanitização (DOMPurify)
[[module.mounts]]
source = "node_modules/fuse.js/dist/fuse.min.js"
target = "static/js/fuse.min.js"
[[module.mounts]]
source = "node_modules/dompurify/dist/purify.min.js"
target = "static/js/purify.min.js"

[params]
title = "Rafael Dutra"
description = "DevOps / SRE — automação de infraestrutura, Kubernetes, CI/CD e cloud. Porto Alegre/RS, Brasil."
images = ["/img/avatar-icon.png"]

# Texto do logo no header (duas partes)
logo_text1 = "Rafael"
logo_text2 = "Dutra"

# Esquema de cor de marca (vermelho do site anterior)
[params.primaryColor]
light = "#e60000"
dark = "#ff5a5a"

# Seletor de múltiplos esquemas de cor — recurso de demo, desligado
[params.colorSchemeSwitcher]
enable = false
[params.colorSchemeSwitcher.selector.disable]
footer = true
header = true

# Quantos itens de experiência aparecem na home
homepageExperienceCount = 6

[params.seo]
siteName = "Rafael Dutra"
siteDescription = "DevOps / SRE — automação de infraestrutura, Kubernetes, CI/CD e cloud."
siteImage = "/img/avatar-icon.png"

[params.seo.person]
name = "Rafael Dutra"
url = "https://rafaeldutra.me"
jobTitle = "DevOps / SRE Engineer"
sameAs = [
  "https://github.com/raffaeldutra",
  "https://gitlab.com/raffaeldutra",
  "https://www.linkedin.com/in/rafaeldutra",
  "https://twitter.com/raffaeldutra",
]
sections = ["showcase", "about", "education", "experience", "client-and-work", "contact"]

[params.social]
twitter = "raffaeldutra"

[params.favicons]
source = "icons/favicon.png"

[params.analytics]
vercelPageInsights = false
vercelAnalytics = false
[params.analytics.googleAnalytics]
# Universal Analytics (legado). Trocar por um ID GA4 "G-..." quando disponível.
code = "UA-92899338-1"
enabled = true
[params.analytics.googleTagManager]
code = "GTM-XXXXX"
enabled = false

[build]
writeStats = true
[build.buildStats]
enabledFor = ["scss"]
disableClasses = false
disableIDs = false
disableTags = false
enable = true

# Plugins (CSS/JS/SCSS carregados pelo tema)
[params.plugins]
[[params.plugins.css]]
URL = "css/custom.css"
[[params.plugins.css]]
URL = "css/adritian-icons.css"
[[params.plugins.css]]
URL = "css/bootstrap-print.css"
[[params.plugins.js]]
URL = "js/rad-animations.js"
[[params.plugins.js]]
URL = "js/sticky-header.js"
[[params.plugins.js]]
URL = "js/library/fontfaceobserver.js"
[[params.plugins.scss]]
URL = "scss/adritian.scss"

[params.colorTheme]
[params.colorTheme.selector.disable]
footer = false
header = false
mobileHeader = false

[params.sharing]
bluesky = true
mastodon = true

[params.blog]
layout = "sidebar-right"
sidebarWidth = "25"
narrowContent = true
showCategories = true
showRecentPosts = true
recentPostCount = 5
listStyle = "summary"
listLayout = "default"
featured_sort_by_weight = true
featured_sort_by_date = false

[params.experience]
showJobCard = true

[params.navbarOverflow]
mode = "dropdown"

[params.languages.selector.disable]
footer = false
header = false
mobileHeader = false

