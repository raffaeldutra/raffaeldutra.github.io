# ---------------------------------------------------------------------------
# Markup / imagem / minificação
# ---------------------------------------------------------------------------
[markup]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
lineNos = false
noClasses = false
style = "github"

[imaging]
resampleFilter = "Lanczos"
quality = 85
anchor = "Smart"

[minify]
disableCSS = false
disableHTML = false
disableJS = false
disableJSON = false
disableSVG = false
disableXML = false
minifyOutput = true
[minify.tdewolff.html]
keepDefaultAttrVals = true
keepWhitespace = false
[minify.tdewolff.css]
precision = 0
[minify.tdewolff.js]
precision = 0

[related]
includeNewer = true
threshold = 80
toLower = false
[[related.indices]]
name = "tags"
weight = 100
[[related.indices]]
name = "date"
weight = 10
