{{ define "main" }}
{{/* The theme hides the breadcrumb for the "cv" type, which also removes the
     fixed-header clearance it normally provides — re-add it here. */}}
<div class="list flex-grow-1">
  <section id="main-content" tabindex="-1" class="section list-{{ .Kind }}" style="padding-top: 120px;">
    <div class="container">
      <div class="row">
        <div class="col-12 col-lg-9">
          {{ if not .Params.hideTitle }}
            <h1 class="mb-4">{{ .Title }}</h1>
          {{ end }}
          <article id="content" class="cv-page">
            {{ .Content }}
          </article>
        </div>
      </div>
    </div>
  </section>
</div>
{{ end }}
